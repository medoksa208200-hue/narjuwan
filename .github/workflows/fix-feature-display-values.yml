name: Fix feature display values

on:
  push:
    paths:
      - '.github/workflows/fix-feature-display-values.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize feature display values
        shell: python
        run: |
          from pathlib import Path
          p=Path('efragh/index.html')
          s=p.read_text(encoding='utf-8')
          old="const $=id=>document.getElementById(id);const value=id=>$(id).value.trim();const num=id=>{const raw=value(id);return raw===''?null:Number(raw)};const text=v=>v===null||v===undefined||String(v).trim()===''?'لا يوجد':String(v);const escapeHtml=v=>text(v).replace(/[&<>\"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[char]));const yesNo=v=>v===true?'نعم':v===false?'لا':'لا يوجد';"
          new="const $=id=>document.getElementById(id);const value=id=>$(id).value.trim();const num=id=>{const raw=value(id);return raw===''?null:Number(raw)};const text=v=>v===null||v===undefined||String(v).trim()===''?'لا يوجد':String(v);const escapeHtml=v=>text(v).replace(/[&<>\"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[char]));const yesNo=v=>v===true?'نعم':v===false?'لا':'لا يوجد';const featureValue=v=>{if(v===null||v===undefined)return'لا يوجد';const x=String(v).trim();if(!x)return'لا يوجد';if(/^ليس رقما(?:\s*م(?:²|2)?)?$/i.test(x)||/^(?:nan|null|undefined|false|no|لا)$/i.test(x))return'لا يوجد';if(/^(?:true|yes|نعم|يوجد)$/i.test(x))return'يوجد';const n=Number(x.replace(/,/g,''));if(Number.isFinite(n))return n>0?String(n):'لا يوجد';return x};"
          if old not in s:
              raise SystemExit('Helper block not found')
          s=s.replace(old,new,1)
          # Only feature-card values: terrace/private roofs/parking and similar fields rendered through yesNo/text.
          for field in ['terrace','private_roofs','parking_count']:
              s=s.replace(f"text(state.unit?.{field})",f"featureValue(state.unit?.{field})")
              s=s.replace(f"yesNo(state.unit?.{field})",f"featureValue(state.unit?.{field})")
          # Generic common aliases if present.
          for field in ['terrace_area','private_roof_area','private_roofs_area','parking']:
              s=s.replace(f"text(state.unit?.{field})",f"featureValue(state.unit?.{field})")
              s=s.replace(f"yesNo(state.unit?.{field})",f"featureValue(state.unit?.{field})")
          p.write_text(s,encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add efragh/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Normalize missing and numeric feature values"
          git push
